<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-icon">💰</div>
    <h1>Finance Tracker</h1>
    <p class="subtitle">Sign in to your dashboard</p>
    <form id="login-form">
      <input id="login-username" type="text" placeholder="Username" required autocomplete="username">
      <input id="login-password" type="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn-primary full-width">Sign In</button>
      <p id="login-error" class="error-msg hidden"></p>
    </form>
  </div>
</div>

<!-- SIDEBAR OVERLAY (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- MAIN APP -->
<div id="app" class="app-layout hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">💰</div>
      <div class="sidebar-logo-text">Finance<span>Track</span></div>
      <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close menu">✕</button>
    </div>

    <div class="sidebar-section-title">Menu</div>
    <ul class="sidebar-nav">
      <li class="active" data-section="overview">
        <button><span class="nav-icon">📊</span> Overview</button>
      </li>
      <li data-section="transactions">
        <button><span class="nav-icon">💳</span> Transactions</button>
      </li>
      <li data-section="categories">
        <button><span class="nav-icon">🏷️</span> Categories</button>
      </li>
    </ul>

    <div class="sidebar-section-title">Tools</div>
    <ul class="sidebar-nav" style="padding-top:0">
      <li>
        <button id="sidebar-sync-btn"><span class="nav-icon">🔄</span> Sync Gmail</button>
      </li>
      <li>
        <button id="sidebar-upload-btn"><span class="nav-icon">📄</span> Upload Statement</button>
      </li>
    </ul>
    <input type="file" id="statement-file" accept="application/pdf" class="hidden">

    <div style="flex:1"></div>
    <div class="sidebar-footer">
      <div class="sidebar-avatar">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-username">admin</div>
        <div class="sidebar-role">Administrator</div>
      </div>
      <button class="sidebar-logout" id="logout-btn" title="Logout">⇥</button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger-btn" id="hamburger-btn" title="Menu">☰</button>
        <div class="topbar-title" id="page-title">Overview</div>
      </div>
      <div class="topbar-actions">
        <span class="sync-status" id="sync-status"></span>
        <button class="btn-ghost" id="sync-btn">🔄 Sync Gmail</button>
        <button class="btn-primary" id="add-tx-btn">+ Add Transaction</button>
      </div>
    </header>

    <main class="content">

      <!-- STATS -->
      <div class="stats-grid" id="stats-grid">
        <!-- injected -->
      </div>

      <!-- CHARTS ROW -->
      <div class="two-col">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Spending by Category</span>
          </div>
          <div class="chart-wrap">
            <canvas id="pie-chart"></canvas>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Top Merchants</span>
          </div>
          <div id="top-merchants"><!-- injected --></div>
        </div>
      </div>

      <!-- TRANSACTIONS -->
      <div class="card" id="section-transactions">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="card-title">Transactions</span>
            <span class="count-badge" id="tx-count-badge">0</span>
          </div>
          <div style="display:flex;gap:8px">
            <span id="upload-status" style="font-size:.82rem;font-weight:500;color:var(--credit)"></span>
            <button class="btn-ghost" id="upload-btn">📄 Upload Statement</button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input id="tx-search" type="text" placeholder="Search merchants, notes...">
          </div>
          <select id="tx-month-filter">
            <option value="all">All Time</option>
            <option value="this_month">This Month</option>
            <option value="last_month">Last Month</option>
            <option value="last_3">Last 3 Months</option>
          </select>
          <select id="tx-source-filter">
            <option value="all">All Sources</option>
            <option value="email">Email</option>
            <option value="statement">Statement</option>
            <option value="manual">Manual</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Merchant</th>
                <th>Category</th>
                <th>Source</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tx-body"><!-- injected --></tbody>
          </table>
        </div>
      </div>

      <!-- CATEGORIES -->
      <div class="card" id="section-categories">
        <div class="card-header">
          <span class="card-title">Categories &amp; Rules</span>
          <button class="btn-sm" id="new-cat-btn">+ New Category</button>
        </div>
        <div class="categories-grid" id="categories-grid"><!-- injected --></div>
      </div>

    </main>
  </div>
</div>

<!-- MODALS -->

<!-- Add Transaction -->
<div id="modal-add-tx" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Add Transaction</h3>
      <button class="modal-close" data-close="modal-add-tx">✕</button>
    </div>
    <form id="add-tx-form" class="modal-form">
      <div class="field"><label>Merchant / Description</label>
        <input id="tx-merchant" type="text" placeholder="e.g. Reliance Fresh" required>
      </div>
      <div class="field"><label>Amount (₹)</label>
        <input id="tx-amount" type="number" placeholder="0.00" step="0.01" min="0.01" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>Type</label>
          <select id="tx-type">
            <option value="debit">Debit (paid)</option>
            <option value="credit">Credit (received)</option>
          </select>
        </div>
        <div class="field"><label>Date</label>
          <input id="tx-date" type="date" required>
        </div>
      </div>
      <div class="field"><label>Category</label>
        <select id="tx-category"><!-- filled by JS --></select>
      </div>
      <div class="field"><label>Note (optional)</label>
        <input id="tx-note" type="text" placeholder="e.g. Birthday dinner">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" data-close="modal-add-tx">Cancel</button>
        <button type="submit" class="btn-primary">Save Transaction</button>
      </div>
    </form>
  </div>
</div>

<!-- Category Rules -->
<div id="modal-cat" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="cat-modal-title">Category Rules</h3>
      <button class="modal-close" data-close="modal-cat">✕</button>
    </div>
    <div id="cat-modal-body"><!-- injected --></div>
  </div>
</div>

<!-- New Category -->
<div id="modal-new-cat" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>New Category</h3>
      <button class="modal-close" data-close="modal-new-cat">✕</button>
    </div>
    <form id="new-cat-form" class="modal-form">
      <div class="field"><label>Category Name</label>
        <input id="new-cat-name" type="text" placeholder="e.g. Gym, Rent, Savings" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" data-close="modal-new-cat">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- Change Category -->
<div id="modal-recat" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Change Category</h3>
      <button class="modal-close" data-close="modal-recat">✕</button>
    </div>
    <div id="recat-body"><!-- injected --></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
